openapi: 3.0.3
info:
  title: SafeWayRoad API
  version: 0.2.0
  description: >
    Contrat d'API du MVP SafeWayRoad — signalement d'incidents et planification
    de trajet sur les Routes Nationales du Cameroun. Ce document sert de mémo
    de référence pendant le développement (Phase 0 → Phase 4 du plan de
    développement) ; il évoluera au fil de l'implémentation réelle.

servers:
  - url: http://localhost:3000
    description: Développement local

tags:
  - name: Santé
  - name: Authentification
  - name: Utilisateurs et rôles
  - name: Entreprises (mini-admin)
  - name: Incidents
  - name: Itinéraires
  - name: Trajets

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------
  # Santé
  # ---------------------------------------------------------------------
  /health:
    get:
      tags: [Santé]
      summary: Vérifie la connexion à la base de données et la présence de PostGIS
      security: []
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Base de données injoignable

  # ---------------------------------------------------------------------
  # Authentification — implémenté (Phase 1)
  # ---------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentification]
      summary: Inscription d'un usager individuel (compte gratuit par défaut)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              description: "Au moins un des deux champs phone / email est requis."
              properties:
                phone: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          description: "Ni téléphone ni email fourni, ou mot de passe trop court"

  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion (retourne un access token et un refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: "Numéro de téléphone OU email"
                password: { type: string }
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Identifiants invalides

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouvelle un access token à partir du refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nouveau access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  # ---------------------------------------------------------------------
  # Utilisateurs et rôles — /users/me implémenté (Phase 1) ; /users/{id}/status reste Phase 3
  # ---------------------------------------------------------------------
  /users/me:
    get:
      tags: [Utilisateurs et rôles]
      summary: Profil de l'utilisateur connecté
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    patch:
      tags: [Utilisateurs et rôles]
      summary: Met à jour le profil de l'utilisateur connecté
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                email: { type: string, format: email }

      responses:
        "200":
          description: Profil mis à jour

  /users/{id}/status:
    patch:
      tags: [Utilisateurs et rôles]
      summary: Active manuellement un statut de compte (gratuit/premium/entreprise)
      description: >
        Réservé à l'administrateur plateforme. Utilisé en back-office pour
        activer un compte payant après un paiement reçu hors plateforme
        (virement bancaire) — cf. cahier des charges §7.5. Planifié Phase 3.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountStatus]
              properties:
                accountStatus:
                  $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: Statut mis à jour

  # ---------------------------------------------------------------------
  # Entreprises (mini-admin) — non implémenté (Phase 3)
  # ---------------------------------------------------------------------
  /companies:
    post:
      tags: [Entreprises (mini-admin)]
      summary: Crée une entreprise partenaire du pilote et son compte mini-admin
      description: "Réservé à l'administrateur plateforme. Planifié Phase 3."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, miniAdminPhoneOrEmail]
              properties:
                name: { type: string }
                miniAdminPhoneOrEmail: { type: string }
      responses:
        "201":
          description: Entreprise créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}/stats:
    get:
      tags: [Entreprises (mini-admin)]
      summary: Statistiques agrégées de l'entreprise (trajets, signalements, activité par équipe)
      description: "Réservé au mini-admin de l'entreprise concernée. Planifié Phase 3."
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyStats"

  /companies/{id}/teams:
    post:
      tags: [Entreprises (mini-admin)]
      summary: Crée une équipe et son chef d'équipe au sein de l'entreprise
      description: "Réservé au mini-admin. Planifié Phase 3."
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, teamLeadPhoneOrEmail]
              properties:
                name: { type: string }
                teamLeadPhoneOrEmail: { type: string }
      responses:
        "201":
          description: Équipe créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}/drivers:
    post:
      tags: [Entreprises (mini-admin)]
      summary: Crée un compte chauffeur rattaché à l'équipe
      description: "Réservé au chef d'équipe de cette équipe. Planifié Phase 3."
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              description: "Au moins un des deux champs phone / email est requis."
              properties:
                phone: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "201":
          description: Chauffeur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /teams/{id}/users/{userId}:
    patch:
      tags: [Entreprises (mini-admin)]
      summary: Active ou désactive un compte de l'équipe
      description: "Réservé au chef d'équipe ou au mini-admin. Planifié Phase 3."
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Compte mis à jour

  # ---------------------------------------------------------------------
  # Incidents — implémenté (exemple de référence dans incident.router.ts)
  # ---------------------------------------------------------------------
  /incidents:
    get:
      tags: [Incidents]
      summary: Liste les incidents actifs
      security: []
      responses:
        "200":
          description: Liste des incidents actifs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"

    post:
      tags: [Incidents]
      summary: Signale un nouvel incident (accessible avec ou sans compte)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                [incidentTypeLabel, latitude, longitude, direction, roadStatus]
              properties:
                IncidentTypeLabel:
                  type: string
                  enum: [ACCIDENT, BREAKDOWN, OBSTACLE, INSECURITY, MEDICAL_EMERGENCY]
                latitude: { type: number }
                longitude: { type: number }
                direction:
                  $ref: "#/components/schemas/Direction"
                roadStatus:
                  $ref: "#/components/schemas/RoadStatus"
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Incident créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    $ref: "#/components/schemas/Incident"
        "422":
          description: Corps de requête invalide

  /incidents/{id}/confirmations:
    post:
      tags: [Incidents]
      summary: Confirme qu'un incident est toujours présent ou a été dégagé
      description: "Planifié Phase 2 — non implémenté."
      security: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  $ref: "#/components/schemas/ConfirmationType"
      responses:
        "201":
          description: Confirmation enregistrée

    # ---------------------------------------------------------------------
    # Itinéraires —  implémenté
    # ---------------------------------------------------------------------
    /itineraries:
      post:
        tags: [Itinéraires]
        summary: Calcule un itinéraire (via OpenRouteService) et superpose les incidents actifs
        # requiert une authentification (bearerAuth par défaut)
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [origin, destination]
                properties:
                  origin:
                    $ref: "#/components/schemas/LatLng"
                  destination:
                    $ref: "#/components/schemas/LatLng"
        responses:
          "201":
            description: Itinéraire calculé
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Itinerary"
          "401":
            description: Authentification requise
          "422":
            description: Coordonnées invalides

  /itineraries/{id}/favorite:
    post:
      tags: [Itinéraires]
      summary: Enregistre l'itinéraire en favori (limite 1 en compte gratuit)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Itinéraire marqué favori
        "401":
          description: Authentification requise
        "403":
          description: "Itinéraire d'un autre utilisateur, ou limite de favoris atteinte pour un compte gratuit"
        "404":
          description: Itinéraire introuvable

  # ---------------------------------------------------------------------
  # Trajets — non implémenté (Phase 4)
  # ---------------------------------------------------------------------
  /trips:
    post:
      tags: [Trajets]
      summary: Démarre le suivi d'un trajet en cours
      description: "Planifié Phase 4 — non implémenté."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itineraryId]
              properties:
                itineraryId: { type: string }
      responses:
        "201":
          description: Trajet démarré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{id}:
    patch:
      tags: [Trajets]
      summary: Termine ou abandonne un trajet en cours
      description: "Planifié Phase 4 — non implémenté."
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/TripStatus"
      responses:
        "200":
          description: Trajet mis à jour

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: boolean }
        service: { type: string }
        database:
          type: object
          properties:
            connected: { type: boolean }
            postgisVersion: { type: string }
            error: { type: string }
        timestamp: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/User"

    AccountStatus:
      type: string
      enum: [FREE, PREMIUM, ENTERPRISE]

    RoleName:
      type: string
      enum: [PLATFORM_ADMIN, MINI_ADMIN, TEAM_LEAD, DRIVER, USER]

    User:
      type: object
      properties:
        id: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        accountStatus:
          $ref: "#/components/schemas/AccountStatus"
        role:
          $ref: "#/components/schemas/RoleName"
        companyId: { type: string, nullable: true }
        teamId: { type: string, nullable: true }
        isActive: { type: boolean }

    Company:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        miniAdminId: { type: string }
        pilotStartDate: { type: string, format: date, nullable: true }
        pilotEndDate: { type: string, format: date, nullable: true }

    Team:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        companyId: { type: string }

    CompanyStats:
      type: object
      properties:
        activeDrivers: { type: integer }
        tripsThisMonth: { type: integer }
        reports: { type: integer }
        ongoingIncidents: { type: integer }

    LatLng:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }

    Direction:
      type: string
      enum: [OUTBOUND, RETURN, BOTH]

    RoadStatus:
      type: string
      enum: [BLOCKED, PARTIAL, CLEAR]

    IncidentStatus:
      type: string
      enum: [ACTIVE, RESOLVED]

    ConfirmationType:
      type: string
      enum: [STILL_THERE, CLEARED]

    Incident:
      type: object
      properties:
        id: { type: string }
        roadSegmentId: { type: string }
        incidentTypeId: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        direction:
          $ref: "#/components/schemas/Direction"
        roadStatus:
          $ref: "#/components/schemas/RoadStatus"
        photoUrl: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/IncidentStatus"
        reportedAt: { type: string, format: date-time }
        lastConfirmedAt: { type: string, format: date-time }

    Itinerary:
      type: object
      properties:
        id: { type: string }
        origin:
          $ref: "#/components/schemas/LatLng"
        destination:
          $ref: "#/components/schemas/LatLng"
        isFavorite: { type: boolean }
        incidentsOnRoute:
          type: array
          items:
            $ref: "#/components/schemas/Incident"

    TripStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]

    Trip:
      type: object
      properties:
        id: { type: string }
        itineraryId: { type: string }
        status:
          $ref: "#/components/schemas/TripStatus"
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
